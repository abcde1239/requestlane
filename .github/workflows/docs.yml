name: Deploy documentation

on:
  push:
    branches: [master]
    paths:
      - docs/public/**
      - website/**
      - examples/**
      - scripts/check-docs.mjs
      - scripts/check-doc-examples.mjs
      - scripts/docs-build.mjs
      - scripts/build.mjs
      - src/**
      - package.json
      - bun.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/public/**
      - website/**
      - examples/**
      - scripts/**
      - src/**
      - package.json
      - bun.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check public docs and TypeScript examples
        run: |
          npm run build
          npm run docs:check
          node scripts/check-doc-examples.mjs
      - name: Build documentation site
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: artifacts/docs-site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
