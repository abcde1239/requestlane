name: Publish npm package

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      tarball: ${{ steps.plan.outputs.tarball }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
      - name: Check release policy
        run: node --test scripts/release-policy.check.mjs scripts/release-cli.check.mjs
      - name: Detect version update
        id: plan
        run: node scripts/release-plan.mjs
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BEFORE: ${{ github.event.before }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.plan.outputs.publish == 'true'
        with:
          bun-version: "1.3.4"
      - name: Install locked dependencies
        if: steps.plan.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Verify formatting, types, tests, coverage, package and browser
        if: steps.plan.outputs.publish == 'true'
        run: npm run verify
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: npm-package
          path: artifacts/${{ steps.plan.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: artifacts
      - name: Recheck registry before publishing
        id: plan
        run: node scripts/release-plan.mjs
        env:
          RELEASE_EVENT: workflow_dispatch
      - name: Publish verified tarball through npm OIDC
        if: steps.plan.outputs.publish == 'true'
        run: npm publish "artifacts/$TARBALL" --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/ --provenance
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          DIST_TAG: ${{ needs.verify.outputs.tag }}
